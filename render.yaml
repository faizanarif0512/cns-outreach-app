services:
  # Django Web Application (100% Free Tier)
  - type: web
    name: cns-outreach-web
    env: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn cns_app.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: cns-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

# PostgreSQL Database (100% Free Tier)
databases:
  - name: cns-db
    databaseName: cns_outreach
    user: cns_user
    region: oregon
    plan: free
