services:
  # 1. Django Web Application
  - type: web
    name: cns-outreach-web
    env: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn cns_app.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cns-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: cns-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # 2. Celery Background Worker
  - type: worker
    name: cns-outreach-worker
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A cns_app worker -l info
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: cns-outreach-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cns-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: cns-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # 3. Redis Task Broker
  - type: redis
    name: cns-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

# 4. PostgreSQL Database
databases:
  - name: cns-db
    databaseName: cns_outreach
    user: cns_user
    region: oregon
    plan: free
